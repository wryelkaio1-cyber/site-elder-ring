  <main class="content">
    <h1>Contato</h1>
    <form onsubmit="fakeSend(event)" class="contact-form">
      <input placeholder="Seu nome" required />
      <input type="email" placeholder="Seu email" required />
      <textarea placeholder="Mensagem" required></textarea>
      <button type="submit">Enviar</button>
      <p class="sent" id="sent" style="display:none;color:#b6e27a">Mensagem preparada (simulada).</p>
    </form>
  </main>
