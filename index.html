<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Login - O Caminho do Maculado</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="login-bg">
  <div class="centered">
    <div class="login-card">
      <img src="assets/logo.png" alt="logo" class="logo">
      <h2>Entre no Caminho</h2>
      <input id="user" placeholder="Usuário" />
      <input id="pass" type="password" placeholder="Senha" />
      <button id="btn-login">Entrar</button>
      <p id="erro" class="erro"></p>
      <p class="hint">Usuário: <b>maculado</b> | Senha: <b>eldenring</b></p>
    </div>
    <p class="credit">Site temático — sem backend — login local</p>
  </div>

  <script src="script.js"></script>
  <script>
    document.getElementById("btn-login").addEventListener("click", login);
    document.addEventListener("keydown", function(e){ if(e.key === "Enter") login(); });
  </script>
</body>
</html>
